name: Sync Site.bundle from public

# Runs automatically whenever you push a change to anything in public/
on:
  push:
    branches: [main]
    paths:
      - 'public/**'

# Allow the action to commit the regenerated Site.bundle back to the repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Rebuild Site.bundle to match public/
        run: |
          rm -rf Site.bundle
          cp -R public Site.bundle

      - name: Commit the updated Site.bundle (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Site.bundle
          if git diff --staged --quiet; then
            echo "Site.bundle already in sync — nothing to commit."
          else
            git commit -m "Auto-sync Site.bundle from public/"
            git push
          fi
